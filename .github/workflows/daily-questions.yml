name: Daily Questions   # 매일 문제 자동 생성

on:
  schedule:
    - cron: '0 21 * * *'   # 매일 06:00 (한국시간) = UTC 21:00
  workflow_dispatch:        # 버튼으로 수동 실행도 가능

permissions:
  contents: write           # questions.json 커밋/푸시 권한

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 가져오기
        uses: actions/checkout@v4

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 문제 생성
        run: python generate_questions.py

      - name: 변경사항 커밋 & 푸시
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add questions.json
          git commit -m "매일 문제 갱신: $(date -u +%Y-%m-%d)" || echo "변경 없음"
          git push
